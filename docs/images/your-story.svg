<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t d"><title id="t">Your Story monthly timeline</title><desc id="d">A vertical timeline with February and March cards, objective summaries, source details controls, and export selection.</desc><rect width="390" height="844" rx="42" fill="#25342e"/><rect x="9" y="9" width="372" height="826" rx="35" fill="#f8f6f0"/><rect x="153" y="18" width="84" height="22" rx="11" fill="#25342e"/><text x="25" y="78" fill="#487263" font-family="Arial" font-size="10" font-weight="700" letter-spacing="1.3">CHRONOLOGICAL VIEW</text><text x="25" y="112" fill="#25342e" font-family="Arial" font-size="28" font-weight="700">Your Story</text><rect x="25" y="132" width="340" height="48" rx="15" fill="#fff" stroke="#dfe5e0"/><rect x="29" y="136" width="109" height="40" rx="11" fill="#dcebe3"/><g fill="#25342e" font-family="Arial" font-size="12" font-weight="700" text-anchor="middle"><text x="84" y="161">Month</text><text x="195" y="161">Week</text><text x="308" y="161">Custom</text></g><line x1="42" y1="213" x2="42" y2="700" stroke="#b7cfc3" stroke-width="2"/><circle cx="42" cy="227" r="7" fill="#487263"/><rect x="62" y="207" width="303" height="225" rx="20" fill="#fff" stroke="#dfe5e0"/><text x="81" y="238" fill="#487263" font-family="Arial" font-size="9" font-weight="700">2026-03-01 — 2026-03-31</text><text x="81" y="268" fill="#25342e" font-family="Arial" font-size="20" font-weight="700">March 2026</text><text x="81" y="299" fill="#68766f" font-family="Arial" font-size="13"><tspan x="81">You completed 14 check-ins during this</tspan><tspan x="81" dy="20">period. Fatigue and Headache were</tspan><tspan x="81" dy="20">recorded most often. Your average</tspan><tspan x="81" dy="20">recorded sleep quality was 3.4 of 5.</tspan></text><line x1="81" y1="386" x2="346" y2="386" stroke="#dfe5e0"/><text x="81" y="414" fill="#487263" font-family="Arial" font-size="12" font-weight="700">Show source details</text><text x="337" y="414" fill="#487263" font-size="16">⌄</text><circle cx="42" cy="473" r="7" fill="#487263"/><rect x="62" y="453" width="303" height="220" rx="20" fill="#fff" stroke="#dfe5e0"/><text x="81" y="484" fill="#487263" font-family="Arial" font-size="9" font-weight="700">2026-02-01 — 2026-02-28</text><text x="81" y="514" fill="#25342e" font-family="Arial" font-size="20" font-weight="700">February 2026</text><text x="81" y="545" fill="#68766f" font-family="Arial" font-size="13"><tspan x="81">You completed 11 check-ins during this</tspan><tspan x="81" dy="20">period. Fatigue was recorded most often.</tspan><tspan x="81" dy="20">You added one milestone.</tspan></text><line x1="81" y1="624" x2="346" y2="624" stroke="#dfe5e0"/><text x="81" y="652" fill="#487263" font-family="Arial" font-size="12" font-weight="700">Show source details</text><rect x="24" y="705" width="342" height="48" rx="15" fill="#487263"/><text x="195" y="735" fill="#fff" font-family="Arial" font-size="13" font-weight="700" text-anchor="middle">Export selected</text><rect x="9" y="770" width="372" height="65" fill="#fff"/><path d="M9 770h372" stroke="#dfe5e0"/><text x="195" y="808" fill="#487263" font-family="Arial" font-size="11" text-anchor="middle">Your Story · from Trends</text></svg>
